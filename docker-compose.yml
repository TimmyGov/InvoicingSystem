version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: invoicesystem-postgres
    environment:
      POSTGRES_DB: invoicesystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoicesystem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoicesystem-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=invoicesystem;Username=postgres;Password=postgres
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - invoicesystem-network

  angular:
    image: node:18-alpine
    container_name: invoicesystem-angular
    working_dir: /app
    volumes:
      - ./src/InvoiceSystem.Web:/app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    networks:
      - invoicesystem-network
    depends_on:
      - api

volumes:
  postgres_data:

networks:
  invoicesystem-network:
    driver: bridge
